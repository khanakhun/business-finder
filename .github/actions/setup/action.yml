# Shared job setup: Node (from .nvmrc) + pnpm (from package.json "packageManager") with the store cached,
# Turborepo's local cache, and uv when services/intel exists. Third-party actions are pinned by commit SHA
# (docs/CI.md explains how to update them).
name: Setup
description: Node, pnpm, Turborepo cache, uv and dependencies for a CI job.
inputs:
  cache-key:
    description: Name of the job, so each job restores the Turborepo cache it wrote last time.
    required: true
  install:
    description: Run `pnpm install --frozen-lockfile`.
    default: "true"
runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # Only jobs that install cache the pnpm store: without an install there is no store to save, and saving a
        # missing path fails the job (a lockfile change means a cache miss, so the post step tries to save).
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - name: uv (services/intel)
      if: hashFiles('services/intel/uv.lock') != ''
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: services/intel/uv.lock
    - name: Turborepo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-key }}-
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
