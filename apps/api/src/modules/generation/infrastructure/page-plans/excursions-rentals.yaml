id: excursions_rentals
match: [marine_nautical, tourism_leisure, automotive_transport.vehicle_rental, automotive_transport.passenger_transport]
pages:
  - kind: home
    slug: ''
    blocks:
      - { type: hero, variant: image_full, otherwise: centered, requires: { images: 1 } }
      - { type: highlights, variant: icons, requires: { kinds: [service, amenity, language_spoken, area_served, award], min: 2 } }
      - { type: services, variant: cards, requires: { kinds: [service], min: 1 }, fills: [service, price] }
      - { type: booking, variant: link, requires: { kinds: [booking_provider] } }
      - { type: gallery, variant: carousel, requires: { images: 3 } }
      - { type: testimonials, variant: cards, requires: { kinds: [testimonial] } }
      - { type: location, variant: map_split, requires: { kinds: [address, geo] } }
      - { type: contact, variant: split }
  - kind: services
    slug: services
    requires: { kinds: [service], min: 4 }
    blocks:
      - { type: hero, variant: minimal }
      - { type: services, variant: grid, requires: { kinds: [service] }, fills: [service, price] }
      - { type: cta_banner, variant: solid }
  - kind: about
    slug: a-propos
    requires: { kinds: [about_summary, tagline, team_member, year_founded, award], min: 2 }
    blocks:
      - { type: hero, variant: minimal }
      - { type: about, variant: story, otherwise: centered, requires: { images: 1 } }
      - { type: team, variant: grid, requires: { kinds: [team_member] }, section: true }
  - kind: contact
    slug: contact
    requires: { kinds: [phone, email, whatsapp, address], min: 2 }
    blocks:
      - { type: hero, variant: minimal }
      - { type: contact, variant: centered }
      - { type: hours, variant: table, requires: { kinds: [hours] } }
      - { type: location, variant: map_full, requires: { kinds: [address, geo] } }
