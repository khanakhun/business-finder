# Alertmanager (BF-061): routing by severity. Addresses are filled in at start-up from the environment
# (ALERT_EMAIL_TO, ALERT_EMAIL_FROM, ALERT_SMTP_SMARTHOST, ALERT_SMTP_USERNAME — see the compose file); secrets are
# files (/run/secrets/…): the SMTP password and the chat webhook URL (a Slack incoming webhook, or a Telegram bot
# relay). Alerts carry `owner`; everyone is one team today, so owners share the receivers.
global:
  smtp_smarthost: '__ALERT_SMTP_SMARTHOST__'
  smtp_from: '__ALERT_EMAIL_FROM__'
  smtp_auth_username: '__ALERT_SMTP_USERNAME__'
  smtp_auth_password_file: /run/secrets/alert_smtp_password
  smtp_require_tls: true
  resolve_timeout: 5m

route:
  receiver: email
  group_by: [alertname, owner]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Pages: e-mail and chat, repeated hourly until resolved.
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
    # Tickets: one e-mail a day.
    - matchers: [severity="ticket"]
      receiver: email
      repeat_interval: 24h

# A page silences the warning of the same thing (e.g. disk 90% over disk 80%).
inhibit_rules:
  - source_matchers: [alertname="DiskAlmostFull"]
    target_matchers: [alertname="DiskFillingUp"]
    equal: [mountpoint]
  - source_matchers: [alertname="ApiErrorBudgetBurnFast"]
    target_matchers: [alertname="ApiErrorBudgetBurnSlow"]

receivers:
  - name: email
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
  - name: page
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
