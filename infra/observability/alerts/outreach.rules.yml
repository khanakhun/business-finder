# Prometheus alerting rules for the outbound email pipeline (BF-052). Load them in the deployment's Prometheus
# (`rule_files:`); the series come from the API worker's /metrics (bf_outreach_*).
groups:
  - name: outreach
    rules:
      - alert: OutreachSendFailureRate
        # More than 5% of send outcomes are failures: a provider is down, a mailbox lost its credentials, or a
        # recipient domain refuses our mail.
        expr: |
          sum(rate(bf_outreach_messages_total{status="failed"}[5m]))
            / clamp_min(sum(rate(bf_outreach_messages_total[5m])), 1e-9) > 0.05
          and sum(increase(bf_outreach_messages_total[5m])) >= 5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Over 5% of outbound emails fail
          description: Check the outbox's Failed tab (last error per message) and the mailboxes' health.
      - alert: OutreachSendStuck
        # A message has been `sending` for more than 10 minutes past its lease: the tick should have re-leased it
        # for reconciliation. The worker or the tick is not running, or reconciliation keeps failing.
        expr: max(bf_outreach_stuck_sending) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Outbound emails are stuck in sending
          description: Messages are still sending more than 10 minutes after their lease ended. Check that the worker runs and the outreach-tick queue drains.
