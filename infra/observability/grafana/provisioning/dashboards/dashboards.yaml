# Dashboards as code (BF-061): infra/observability/dashboards/*.json, generated by scripts/infra/gen-dashboards.mjs.
# Edits in the UI are not kept: change the generator and regenerate.
apiVersion: 1
providers:
  - name: business-finder
    orgId: 1
    folder: Business Finder
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
