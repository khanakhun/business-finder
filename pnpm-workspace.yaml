  # QR codes for TOTP setup (no dependencies; returns the module matrix, rendered as React SVG).
  uqr: 0.1.3
  # Marks modules that must never reach the browser bundle (build error if a client component imports them).
  server-only: 0.0.1

# lefthook's postinstall only copies a binary that pnpm already installs from its optional platform
# package; `pnpm prepare` installs the git hooks. Everything else stays blocked (pnpm 10 default).
# `allowBuilds` (pnpm ≥ 10.26) replaces the onlyBuilt/ignoredBuilt lists removed in pnpm 11.
allowBuilds:
  lefthook: false
  # esbuild (via drizzle-kit) resolves its binary from optional platform packages; its postinstall only verifies.
  esbuild: false
  # @swc/core resolves its native binary from optional platform packages.
  '@swc/core': false
  # ssh2/cpu-features (via testcontainers) have optional native speedups we don't need.
  cpu-features: false
  ssh2: false
