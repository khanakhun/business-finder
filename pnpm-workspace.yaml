packages:
  - apps/*
  - packages/*
  - services/*

# Single source of truth for versions shared across workspaces; reference with "catalog:".
# Entries without a consumer yet are pinned now so the first ticket that needs them gets an aligned major.
catalog:
  # tooling
  '@biomejs/biome': 2.5.15
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  lefthook: 2.2.2
  turbo: 2.11.8
  # DECISION(BF-001): TypeScript 6.x, not 7.x — TS 7 (native port) only ships an `unstable/*` compiler API,
  # which tsup dts, the NestJS CLI and typescript-eslint still depend on. Revisit when its stable API lands.
  typescript: 6.0.3
  '@types/node': 24.19.2
  # testing
  vitest: 5.0.4
  '@vitest/coverage-v8': 5.0.4
  '@faker-js/faker': 10.6.0
  happy-dom: 21.0.1
  # database
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  postgres: 3.4.9
  testcontainers: 12.2.1
  uuid: 14.0.3
  # observability
  pino: 10.4.0
  pino-pretty: 13.2.0
  prom-client: 15.1.3
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/core': 2.12.0
  '@opentelemetry/sdk-node': 0.223.0
  '@opentelemetry/sdk-trace-base': 2.12.0
  '@opentelemetry/exporter-trace-otlp-http': 0.223.0
  '@opentelemetry/resources': 2.12.0
  '@opentelemetry/semantic-conventions': 1.43.0
  '@opentelemetry/instrumentation-http': 0.223.0
  '@opentelemetry/instrumentation-undici': 0.33.0
  '@opentelemetry/instrumentation-ioredis': 0.71.0
  # runtime
  zod: 4.6.7
  react: 19.3.1
  react-dom: 19.3.1
  next: 16.4.1
  '@nestjs/common': 12.1.3
  '@nestjs/core': 12.1.3
  '@nestjs/testing': 12.1.3

# lefthook's postinstall only copies a binary that pnpm already installs from its optional platform
# package; `pnpm prepare` installs the git hooks. Everything else stays blocked (pnpm 10 default).
# `allowBuilds` (pnpm ≥ 10.26) replaces the onlyBuilt/ignoredBuilt lists removed in pnpm 11.
allowBuilds:
  lefthook: false
  # esbuild (via drizzle-kit) resolves its binary from optional platform packages; its postinstall only verifies.
  esbuild: false
  # ssh2/cpu-features (via testcontainers) have optional native speedups we don't need.
  cpu-features: false
  ssh2: false
