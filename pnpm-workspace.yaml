  '@opentelemetry/instrumentation-http': 0.223.0
  '@opentelemetry/instrumentation-undici': 0.33.0
  '@opentelemetry/instrumentation-ioredis': 0.71.0
  # runtime
  zod: 4.6.7
  react: 19.3.1
  react-dom: 19.3.1
  next: 16.4.1
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  next-intl: 4.14.9
  next-themes: 0.4.6
  '@tanstack/react-query': 5.104.2
  '@tanstack/react-query-devtools': 5.104.2
  # Ticket/ARCHITECTURE specify v8; v9 (Aug 2026) changes the API.
  '@tanstack/react-table': 8.21.3
  '@tanstack/react-virtual': 3.14.19
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  radix-ui: 1.8.1
  cmdk: 1.1.1
  sonner: 2.0.8
  react-hook-form: 7.90.0
  '@hookform/resolvers': 5.9.1
  lucide-react: 1.57.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@testing-library/jest-dom': 7.0.1
  '@playwright/test': 1.64.1
  '@axe-core/playwright': 4.13.0
  '@nestjs/common': 12.1.3
  '@nestjs/core': 12.1.3
  '@nestjs/testing': 12.1.3
  '@nestjs/platform-express': 12.1.3
  '@nestjs/swagger': 12.0.2
