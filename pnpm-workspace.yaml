  '@nestjs/bullmq': 12.0.0
  '@bull-board/api': 9.10.4
  '@bull-board/express': 9.10.4
  '@bull-board/nestjs': 9.10.4
  bullmq: 6.3.15
  ioredis: 6.0.0
  cockatiel: 4.0.0
  helmet: 8.3.0
  express: 5.3.0
  '@types/express': 5.0.6
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.1
  '@types/supertest': 7.2.1
  '@swc/core': 1.16.18
  '@swc-node/register': 1.12.1
  unplugin-swc: 2.0.0
  # identity (BF-010)
  better-auth: 1.7.8
  '@better-auth/api-key': 1.7.8
  # Better Auth CLI (schema generation); the package is named `auth`.
  auth: 1.7.8
  nodemailer: 10.1.1
