[project]
name = "bf-intel"
version = "0.0.0"
description = "Stateless compute sidecar for crawling, open-data queries and ML (ADR-0002). Never touches the DB."
requires-python = ">=3.13,<3.14"
# Lower bounds = versions verified for BF-008; uv.lock pins exact versions.
dependencies = [
  "fastapi>=0.143.1,<0.144",
  "uvicorn[standard]>=0.54.0,<0.55",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.0,<3",
  "structlog>=26.1.0,<27",
  "httpx>=0.28.1,<0.29",
  "prometheus-client>=0.26.0,<0.27",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-httpx==0.66b1",
  # The image installs the matching Chromium (`playwright install`); crawling arrives in BF-026.
  "playwright>=1.64.0,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.17.0,<0.18",
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "respx>=0.23.1,<0.24",
  "hypothesis>=6.169.1,<7",
  "taskipy>=1.14.1,<2",
  "datamodel-code-generator>=0.83.0,<0.84",
  # starlette.testclient requires it (httpx is deprecated there); safe_fetch stays on httpx (ticket, respx, OTel).
  "httpx2>=2.13.1,<3",
]

[tool.uv]
package = false

[tool.taskipy.tasks]
dev = { cmd = "python -m app.serve --reload", help = "uvicorn with reload on INTEL_PORT" }
lint = { cmd = "ruff check . && ruff format --check .", help = "ruff lint + format check" }
format = { cmd = "ruff check --fix . && ruff format .", help = "apply ruff fixes and formatting" }
typecheck = { cmd = "mypy", help = "mypy --strict" }
test = { cmd = "pytest -q", help = "pytest with coverage" }
verify = { cmd = "task lint && task typecheck && task test", help = "everything CI runs" }
contracts = { cmd = "python scripts/gen_contracts.py", help = "regenerate app/contracts from JSON Schema" }

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["app/contracts"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "PL", "TRY", "N", "ANN", "DTZ", "PERF",
]
ignore = [
  "PLR2004", # magic values: tests and HTTP status codes read better inline
  "TRY003",  # long messages in exception constructors are fine for typed errors
  "PLR0913", # FastAPI dependencies are injected as parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "ANN", "PLR0915", "TRY301"]
"scripts/**" = ["S603", "S607", "T201"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["app", "tests", "scripts"]
exclude = ["app/contracts/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Generated models are type-checked where they are used, not linted as source.
module = "app.contracts.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["app/contracts/*", "app/serve.py"]
